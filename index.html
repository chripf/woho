<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Calendar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;background:#f3f6fa;height:100vh;display:flex;flex-direction:column}
.header{background:#1f2937;color:white;padding:1rem 2rem;box-shadow:0 2px 5px rgba(0,0,0,.15)}
.calendar-wrapper{flex:1;padding:16px}
iframe{width:100%;height:100%;border:none;border-radius:12px;background:white;box-shadow:0 4px 12px rgba(0,0,0,.1)}
</style>
</head>
<body>
<div class="header"><h2>Team Calendar</h2></div>
<div class="calendar-wrapper">
<iframe src="https://calendar.google.com/calendar/embed?src=uvdvi8f0egn85im9mc5dcpfccs%40group.calendar.google.com&mode=MONTH"></iframe>
</div>
</body>
</html>
